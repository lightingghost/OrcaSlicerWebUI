name: Build and publish Docker image

# Builds and publishes a multi-arch (linux/amd64 + linux/arm64) image.
#
# Each architecture is built NATIVELY on its own runner (ubuntu-24.04 for
# amd64, ubuntu-24.04-arm for arm64) rather than cross-compiling one of
# them under QEMU emulation — this Dockerfile's runtime stage does a lot
# of apt-get work (OrcaSlicer's GTK/WebKit/GStreamer runtime deps) plus a
# full frontend npm build, both of which are slow enough under emulation
# to make a single-job `platforms: linux/amd64,linux/arm64` build
# impractically slow / prone to CI timeouts. The two per-arch images are
# pushed to the registry by DIGEST ONLY (no tag) from the `build` matrix,
# then stitched into one multi-arch manifest under the real tags by the
# `merge` job — see:
# https://docs.docker.com/build/ci/github-actions/multi-platform/
#
# Architecture no longer needs to be selected via build.env's old ARCH
# variable — the Dockerfile picks the right OrcaSlicer AppImage asset
# automatically from Buildx's TARGETARCH build-arg (see Dockerfile stage
# 3's comment), so this workflow just builds both platforms.

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      orcaslicer_version:
        description: >-
          OrcaSlicer version to build (without leading "v", e.g. 2.4.2).
          Leave blank to use the version pinned in build.env.
        required: false
        type: string
      push:
        description: "Push the built image(s) to GHCR"
        required: false
        type: boolean
        default: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Whether this run should push anything to the registry at all. PRs
  # never push (they only build, to catch breakage). Manual runs push
  # unless the "push" input is explicitly unchecked, letting you kick off
  # a build-only smoke test from the Actions UI without publishing an
  # image. Every other trigger (push to main, tag) always pushes.
  SHOULD_PUSH: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.push) }}

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-24.04-arm is a native (non-emulated) GitHub-hosted
          # arm64 runner — see
          # https://github.blog/changelog/2025-08-07-arm64-hosted-runners-for-public-repositories-are-now-generally-available/
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch-tag: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch-tag: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # GHCR (and OCI registries generally) require lowercase image
      # names, but `github.repository` preserves the repo's actual case
      # (here, "lightingghost/OrcaSlicerWebUI") — pushing with that as-is
      # fails with "invalid reference format: repository name ... must be
      # lowercase". GitHub Actions expressions have no built-in lowercase
      # function, so normalize it here and let it override the
      # workflow-level IMAGE_NAME default for the rest of this job.
      - name: Compute lowercase image name
        run: echo "IMAGE_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Load build config (ORCASLICER_VERSION)
        run: |
          # build.env is comment-heavy (see the file itself) — $GITHUB_ENV
          # only accepts KEY=VALUE lines, so strip blank lines and
          # comments before appending rather than `cat`-ing the whole file.
          grep -Ev '^\s*(#|$)' build.env >> "$GITHUB_ENV"
          # A manually-supplied version overrides the one pinned in
          # build.env, so a workflow_dispatch run can build/publish a
          # different OrcaSlicer release without editing the repo.
          if [ -n "${{ inputs.orcaslicer_version }}" ]; then
            echo "ORCASLICER_VERSION=${{ inputs.orcaslicer_version }}" >> "$GITHUB_ENV"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: env.SHOULD_PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ env.ORCASLICER_VERSION }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      # Pushes by DIGEST ONLY when SHOULD_PUSH (note: no `tags:` input,
      # and push-by-digest requires the plain registry exporter, so
      # `provenance: false` avoids buildx defaulting to the OCI-only
      # attestation-manifest exporter). PRs, and manual runs with the
      # "push" input unchecked, still build (to catch breakage/let you
      # smoke-test a build) but never push. The final user-facing tags
      # from `meta` above are applied only once, on the combined
      # multi-arch manifest, by the `merge` job — applying them per-arch
      # here would just create (and then need to clean up) N temporary
      # tags per real tag.
      - name: Build (and push by digest if enabled)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          push: ${{ env.SHOULD_PUSH == 'true' }}
          provenance: false
          build-args: |
            ORCASLICER_VERSION=${{ env.ORCASLICER_VERSION }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=${{ env.SHOULD_PUSH == 'true' }}
          cache-from: type=gha,scope=${{ matrix.arch-tag }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch-tag }}

      - name: Export digest
        if: env.SHOULD_PUSH == 'true'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: env.SHOULD_PUSH == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch-tag }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge multi-arch manifest
    needs: build
    # Mirrors the build job's SHOULD_PUSH formula — job-level `if:`
    # conditions can't read the top-level `env` context, only step-level
    # ones can, so it's spelled out again here directly.
    if: needs.build.result == 'success' && github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.push)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # See the same step's comment in the build job above.
      - name: Compute lowercase image name
        run: echo "IMAGE_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Load build config (ORCASLICER_VERSION)
        run: |
          grep -Ev '^\s*(#|$)' build.env >> "$GITHUB_ENV"
          if [ -n "${{ inputs.orcaslicer_version }}" ]; then
            echo "ORCASLICER_VERSION=${{ inputs.orcaslicer_version }}" >> "$GITHUB_ENV"
          fi

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ env.ORCASLICER_VERSION }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      # Combines the two per-arch images (referenced by the digests
      # uploaded above) into ONE multi-arch manifest, published under
      # every tag computed by metadata-action — this is the step that
      # actually makes `docker pull ...` on either an amd64 or arm64
      # host transparently fetch the right image.
      - name: Create multi-arch manifest and push
        working-directory: /tmp/digests
        run: |
          set -euo pipefail
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          TAG_ARGS=$(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          DIGEST_REFS=$(printf "${IMAGE}@sha256:%s " *)
          docker buildx imagetools create ${TAG_ARGS} ${DIGEST_REFS}
        env:
          DOCKER_METADATA_OUTPUT_JSON: ${{ steps.meta.outputs.json }}

      - name: Inspect resulting manifest
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
