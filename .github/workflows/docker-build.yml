name: Build and publish Docker image

# Builds and publishes a multi-arch (linux/amd64 + linux/arm64) image.
#
# Each architecture is built NATIVELY on its own runner (ubuntu-24.04 for
# amd64, ubuntu-24.04-arm for arm64) rather than cross-compiling one of
# them under QEMU emulation — this Dockerfile's runtime stage does a lot
# of apt-get work (OrcaSlicer's GTK/WebKit/GStreamer runtime deps) plus a
# full frontend npm build, both of which are slow enough under emulation
# to make a single-job `platforms: linux/amd64,linux/arm64` build
# impractically slow / prone to CI timeouts. The two per-arch images are
# pushed to the registry by DIGEST ONLY (no tag) from the `build` matrix,
# then stitched into one multi-arch manifest under the real tags by the
# `merge` job — see:
# https://docs.docker.com/build/ci/github-actions/multi-platform/
#
# Architecture no longer needs to be selected via build.env's old ARCH
# variable — the Dockerfile picks the right OrcaSlicer AppImage asset
# automatically from Buildx's TARGETARCH build-arg (see Dockerfile stage
# 3's comment), so this workflow just builds both platforms.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-24.04-arm is a native (non-emulated) GitHub-hosted
          # arm64 runner — see
          # https://github.blog/changelog/2025-08-07-arm64-hosted-runners-for-public-repositories-are-now-generally-available/
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch-tag: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch-tag: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Load build config (ORCASLICER_VERSION)
        run: cat build.env >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ env.ORCASLICER_VERSION }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      # Pushes by DIGEST ONLY on non-PR events (note: no `tags:` input,
      # and push-by-digest requires the plain registry exporter, so
      # `provenance: false` avoids buildx defaulting to the OCI-only
      # attestation-manifest exporter). PRs still build (to catch
      # breakage) but never push. The final user-facing tags from `meta`
      # above are applied only once, on the combined multi-arch manifest,
      # by the `merge` job — applying them per-arch here would just
      # create (and then need to clean up) N temporary tags per real tag.
      - name: Build (and push by digest on non-PR events)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          push: ${{ github.event_name != 'pull_request' }}
          provenance: false
          build-args: |
            ORCASLICER_VERSION=${{ env.ORCASLICER_VERSION }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}
          cache-from: type=gha,scope=${{ matrix.arch-tag }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch-tag }}

      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch-tag }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge multi-arch manifest
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Load build config (ORCASLICER_VERSION)
        run: cat build.env >> "$GITHUB_ENV"

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ env.ORCASLICER_VERSION }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      # Combines the two per-arch images (referenced by the digests
      # uploaded above) into ONE multi-arch manifest, published under
      # every tag computed by metadata-action — this is the step that
      # actually makes `docker pull ...` on either an amd64 or arm64
      # host transparently fetch the right image.
      - name: Create multi-arch manifest and push
        working-directory: /tmp/digests
        run: |
          set -euo pipefail
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          TAG_ARGS=$(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          DIGEST_REFS=$(printf "${IMAGE}@sha256:%s " *)
          docker buildx imagetools create ${TAG_ARGS} ${DIGEST_REFS}
        env:
          DOCKER_METADATA_OUTPUT_JSON: ${{ steps.meta.outputs.json }}

      - name: Inspect resulting manifest
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
