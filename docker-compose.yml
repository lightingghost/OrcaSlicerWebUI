# Docker Compose configuration for OrcaSlicer Web UI.
#
# Single container: uvicorn (FastAPI) serves both the API and the React SPA.
# The OrcaSlicer CLI (extracted from the pinned AppImage release) is baked
# into the image at build time — no host bind-mount required.
#
# Build with:
#   docker compose --env-file build.env build
#   docker compose --env-file build.env up -d
#
# See build.env for ORCASLICER_VERSION / ARCH values.

services:
  orcaslicer-webui:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ORCASLICER_VERSION: ${ORCASLICER_VERSION}
        ARCH: ${ARCH}
        VITE_API_SECRET: ${API_SECRET:-changeme}
    ports:
      - "80:8080"
    environment:
      - API_SECRET=${API_SECRET:-changeme}
    volumes:
      - workspace:/app/workspace
    restart: unless-stopped

volumes:
  workspace:
